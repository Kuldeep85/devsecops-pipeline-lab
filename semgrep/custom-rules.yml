rules:
  - id: demo-sqli-string-concat
    languages: [javascript]
    severity: ERROR
    message: >
      SQL query built by string concatenation with request data.
      Use a parameterised query instead (e.g. db.query("... WHERE name = ?", [name])).
    pattern-either:
      - pattern: db.query("..." + $X)
      - pattern: db.query("..." + $X + "...")
  - id: demo-eval-usage
    languages: [javascript]
    severity: WARNING
    message: >
      eval() runs arbitrary code. Avoid it; use JSON.parse or a safe alternative.
    pattern: eval(...)